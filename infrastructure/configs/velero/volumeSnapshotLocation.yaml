apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: zfspv
  namespace: velero
spec:
  provider: openebs.io/zfspv-blockstore
  config:
    namespace: openebs # this is the namespace where ZFS-LocalPV creates all the CRs, passed as OPENEBS_NAMESPACE env in the ZFS-LocalPV deployment

    provider: aws
    s3Url: https://s3.doblerones.de:3900
    region: garage
    s3ForcePathStyle: "true"
    checksumAlgorithm: ""

    bucket: velero-backups
    prefix: zfs
    # TODO include incrBackupCount https://openebs.io/docs/user-guides/local-storage-user-guide/local-pv-zfs/advanced-operations/zfs-backup-restore#things-to-consider
